<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Editor card background -->
  <rect x="2" y="3" width="28" height="26" rx="4" fill="#1e1e2e"/>
  <!-- Title bar -->
  <rect x="2" y="3" width="28" height="8" rx="4" fill="#313244"/>
  <rect x="2" y="8" width="28" height="3" fill="#313244"/>
  <!-- Traffic light dots -->
  <circle cx="8"  cy="7" r="1.5" fill="#f38ba8"/>
  <circle cx="13" cy="7" r="1.5" fill="#f9e2af"/>
  <circle cx="18" cy="7" r="1.5" fill="#a6e3a1"/>
  <!-- Code line 1: purple keyword + blue identifier -->
  <rect x="6"  y="15" width="5" height="2" rx="0.5" fill="#cba6f7"/>
  <rect x="13" y="15" width="7" height="2" rx="0.5" fill="#89b4fa"/>
  <!-- Code line 2: indented green string -->
  <rect x="9"  y="19" width="8" height="2" rx="0.5" fill="#a6e3a1"/>
  <!-- Code line 3: short closing syntax -->
  <rect x="6"  y="23" width="4" height="2" rx="0.5" fill="#cba6f7"/>
</svg>
